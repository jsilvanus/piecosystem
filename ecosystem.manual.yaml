# Hand-written catalog entries for services that cannot carry a "pi" block in their
# package.json (Python services, services without package.json, non-HTTP services).
# Read by scripts/generate-ecosystem.mjs; the schema is the pi block schema of README.md
# plus: dir (default: service), kind (service | library | control), runtime (node | python | other),
# versionFile (package.json or pyproject.toml inside dir).
services:
  - service: liturgos-auditor
    displayName: liturgos-auditor
    dir: liturgos-auditor
    layer: Seam
    runtime: python
    versionFile: python-packages/liturgos-auditor-stt/pyproject.toml
    port: 8090
    healthEndpoint: /health
    envPortVar: AUDITOR_STT_PORT
    healthAuthEnv: AUDITOR_STT_API_KEY

  - service: web-radio-relay
    displayName: web-radio-relay
    dir: web-radio-relay
    layer: Seam
    port: 8080
    healthEndpoint: /api/health

  - service: keskuskirkko
    displayName: keskuskirkko (AMX NetLinx)
    dir: keskuskirkko
    layer: Seam
    kind: control
    runtime: other

  - service: fffleet-orchestrator
    displayName: fffleet orchestrator
    dir: fffleet
    versionFile: packages/fffleet-orchestrator/package.json
    layer: Seam
    port: 5000
    healthEndpoint: /v1/health

  - service: virtual-screen-streamer
    displayName: virtual-screen-streamer (formerly picompanion)
    dir: virtual-screen-streamer
    layer: Seam
    kind: control
    runtime: other

  - service: saarnavideo
    displayName: saarnavideo (post-stream editing)
    dir: saarnavideo
    layer: Seam
    kind: control
    runtime: node

  # Added 2026-11-03. The three below have no "pi" block yet (no port or health endpoint known), so they are
  # listed by hand; move each into its package.json "pi" block when it has a port.
  - service: notify-core
    displayName: notify-core (library, @jsilvanus/notify-core)
    dir: notify-core
    layer: Seam
    kind: library
    runtime: node
    versionFile: package.json

  - service: pisim
    displayName: pisim (ecosystem simulator)
    dir: pisim
    layer: Seam
    kind: control
    runtime: node
    versionFile: package.json
