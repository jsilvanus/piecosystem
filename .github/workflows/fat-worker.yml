name: Fat worker image

# Manual only: builds and publishes ghcr.io/<owner>/pieco-fleet-worker (CPU) and/or
# ghcr.io/<owner>/pieco-fleet-worker-gpu (NVENC default), the fat fffleet worker for the operator PC and the
# assisting PC (see docker/fat-worker/Dockerfile). It never runs on push or pull request.
# Set push to false to only check that the image builds.

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Tag of ghcr.io/jsilvanus/lcyt-fleet-worker to build on"
        required: false
        default: "latest"
        type: string
      image_tag:
        description: "Tag to publish (the commit sha tag is always added)"
        required: false
        default: "latest"
        type: string
      variant:
        description: "Which image: cpu, gpu or both"
        required: false
        default: "both"
        type: choice
        options: [cpu, gpu, both]
      push:
        description: "Push the image to ghcr (false = build only)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  plan:
    name: Pick the images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          cpu='{"image":"pieco-fleet-worker","gpu":"0","encoder":"x264"}'
          gpu='{"image":"pieco-fleet-worker-gpu","gpu":"1","encoder":"nvenc"}'
          case "$VARIANT" in
            cpu) include="[$cpu]" ;;
            gpu) include="[$gpu]" ;;
            *) include="[$cpu,$gpu]" ;;
          esac
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: docker/fat-worker
          file: docker/fat-worker/Dockerfile
          build-args: |
            BASE_TAG=${{ inputs.base_tag }}
            GPU=${{ matrix.gpu }}
            PAGE_ENCODER=${{ matrix.encoder }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
