# Assisting PC stack ("gaming laptop 2", NVIDIA GPU): DSK rendering and the fat fffleet worker only.
# One container is both: the LCYT fat worker is the stock fffleet worker (ffmpeg) plus Chromium, the DSK
# executor (type:dsk) and perception (type:perception). This PC is first in line for DSK and stream jobs.
# The fffleet orchestrator runs on the Pi (kirkonpi, 192.168.1.78:5000).
#
#   cp .env.example .env
#   docker compose up -d
#   docker compose -f compose.yml -f compose.gpu.yml up -d     # GPU for NVENC / perception
# Nothing here has been run on the real machine yet.
name: assisting-pc

services:
  fleet-worker:
    image: ghcr.io/jsilvanus/lcyt-fleet-worker:${LCYT_FLEET_WORKER_VERSION:-latest}
    ports:
      - "${FFFLEET_WORKER_PORT:-5100}:5100"
    environment:
      PORT: "5100"
      FFFLEET_WORKER_ID: ${FFFLEET_WORKER_ID:-assisting-pc}
      FFFLEET_ADVERTISE_URL: ${FFFLEET_ADVERTISE_URL:?set FFFLEET_ADVERTISE_URL, e.g. http://192.168.1.51:5100}
      FFFLEET_ORCHESTRATOR_URL: ${FFFLEET_ORCHESTRATOR_URL:-http://192.168.1.78:5000}
      FFFLEET_WORKER_TOKEN: ${FFFLEET_WORKER_TOKEN:?set FFFLEET_WORKER_TOKEN}
      FFFLEET_SLOTS: ${FFFLEET_SLOTS:-default=3,stream=2}
      # See the operator PC stack: host/tier tags for routing; the priority order is set on the orchestrator side.
      FFFLEET_CAPABILITIES: ${FFFLEET_CAPABILITIES:-host:assisting-pc,tier:1}
      FFFLEET_PRIORITY: ${FFFLEET_PRIORITY:-1}
      # Drop out of scheduling when MediaMTX on the Pi cannot be reached (stream jobs may pull/push there).
      FFFLEET_PROBE: ${FFFLEET_PROBE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      FFFLEET_S3_ENDPOINT: ${FFFLEET_S3_ENDPOINT:-}
      FFFLEET_S3_PATH_STYLE: ${FFFLEET_S3_PATH_STYLE:-}
    shm_size: "1gb"
    restart: unless-stopped
