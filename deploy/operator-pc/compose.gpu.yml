# NVIDIA overlay for the operator PC: docker compose -f compose.yml -f compose.gpu.yml up -d
# Windows Docker Desktop needs the WSL2 backend and a current NVIDIA driver. Linux needs the NVIDIA Container Toolkit.
# Check with: docker run --rm --gpus all ubuntu nvidia-smi
services:
  auditor-stt:
    image: ghcr.io/jsilvanus/liturgos-auditor-stt:${AUDITOR_VERSION:-latest}-cuda
    environment:
      AUDITOR_STT_DEVICE: ${AUDITOR_STT_DEVICE:-cuda}
      AUDITOR_STT_COMPUTE_TYPE: ${AUDITOR_STT_COMPUTE_TYPE:-float16}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
