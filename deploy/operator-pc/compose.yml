# Operator PC stack (Windows + Docker Desktop, WSL2 backend; also fine on Linux).
#   - auditor-stt   liturgos-auditor speech-to-text (CPU by default, GPU with compose.gpu.yml)
#   - fleet-worker  LCYT "fat" fffleet worker: ffmpeg + DSK (type:dsk) + perception (type:perception)
#   - detect-worker piperception fffleet worker (type:perception-detect): reads a camera from MediaMTX,
#                   runs YOLOX on the CPU and sends only detections back; the Pi detects locally when it is off
#   - translate-worker PiVoice caption translation worker (type:translate, OPUS-MT on the CPU); models come
#                   from the translate-models volume, filled once with the translate-models tool below
#   - ollama        local LLM server, reachable only from this compose network and from localhost
#   - versitygw     S3 gateway (VersityGW, posix backend) = the S3 backend of pistorage; versitygw-init creates its bucket
# The fffleet orchestrator runs on the Pi (wired 10.0.0.78:5000), not here.
#
#   cp .env.example .env   # fill in tokens and this PC's LAN address
#   docker compose up -d
#   docker compose -f compose.yml -f compose.gpu.yml up -d     # NVIDIA GPU
#   docker compose exec ollama ollama pull llama3.1:8b
# pistorage (on the Pi) points at versitygw: PISTORAGE_S3_ENDPOINT=http://<this PC's LAN address>:7070,
# PISTORAGE_S3_BUCKET=pistorage, PISTORAGE_S3_ACCESS_KEY / _SECRET_KEY = VERSITYGW_ACCESS_KEY / _SECRET_KEY below.
# Nothing here has been run on the real machines yet.
name: operator-pc

services:
  auditor-stt:
    image: ghcr.io/jsilvanus/liturgos-auditor-stt:${AUDITOR_VERSION:-latest}
    ports:
      - "${AUDITOR_STT_HOST_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    environment:
      AUDITOR_STT_MODEL: ${AUDITOR_STT_MODEL:-large-v3-turbo}
      AUDITOR_STT_MODEL_DIR: /models
      AUDITOR_STT_DEVICE: ${AUDITOR_STT_DEVICE:-cpu}
      AUDITOR_STT_DEFAULT_LANGUAGE: ${AUDITOR_STT_DEFAULT_LANGUAGE:-fi}
      AUDITOR_STT_DATA_DIR: /data
      AUDITOR_STT_API_KEY: ${AUDITOR_STT_API_KEY:-}
      AUDITOR_STT_REGISTRY_DIR: /models/registry
      AUDITOR_STT_MAX_QUEUE: ${AUDITOR_STT_MAX_QUEUE:-8}
      # Hosts the auditor may pull RTSP/SRT live streams from (comma-separated, wildcards ok). Set it in .env.
      AUDITOR_STT_LIVE_SOURCE_HOSTS: ${AUDITOR_STT_LIVE_SOURCE_HOSTS:-}
    volumes:
      - auditor-stt-models:/models
      - auditor-stt-data:/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  fleet-worker:
    image: ghcr.io/jsilvanus/lcyt-fleet-worker:${LCYT_FLEET_WORKER_VERSION:-latest}
    ports:
      - "${FFFLEET_WORKER_PORT:-5100}:5100"
    environment:
      PORT: "5100"
      FFFLEET_WORKER_ID: ${FFFLEET_WORKER_ID:-operator-pc}
      # The orchestrator calls the worker back on this address: the PC's LAN address, not a container name.
      FFFLEET_ADVERTISE_URL: ${FFFLEET_ADVERTISE_URL:?set FFFLEET_ADVERTISE_URL, e.g. http://10.0.0.50:5100}
      FFFLEET_ORCHESTRATOR_URL: ${FFFLEET_ORCHESTRATOR_URL:-http://10.0.0.78:5000}
      FFFLEET_WORKER_TOKEN: ${FFFLEET_WORKER_TOKEN:?set FFFLEET_WORKER_TOKEN}
      FFFLEET_SLOTS: ${FFFLEET_SLOTS:-stream=8,default=4}
      # Tags for job routing. Jobs choose workers by worker id (workerPreference) and by `requires`, so keep
      # `host:` and `tier:` here; the priority order itself (assisting 1, operator 2, pi 3) is set by the
      # orchestrator side. FFFLEET_PRIORITY is passed through for the job-priority work and is ignored until
      # fffleet reads it.
      FFFLEET_CAPABILITIES: ${FFFLEET_CAPABILITIES:-normal,dsk,gpu,nvenc,desktop,host:operator-pc}
      FFFLEET_PRIORITY: ${FFFLEET_PRIORITY:-2}
      # Reachability probes: a worker that cannot see these drops out of scheduling by itself.
      FFFLEET_PROBE: ${FFFLEET_PROBE:-ollama=ollama:11434,auditor=auditor-stt:8090}
      # lcyt-fleet-worker already sets FFFLEET_EXECUTORS (perception + dsk) and the Chromium path.
      OLLAMA_URL: http://ollama:11434
      AUDITOR_STT_URL: http://auditor-stt:8090
      AUDITOR_STT_API_KEY: ${AUDITOR_STT_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      FFFLEET_S3_ENDPOINT: ${FFFLEET_S3_ENDPOINT:-}
      FFFLEET_S3_PATH_STYLE: ${FFFLEET_S3_PATH_STYLE:-}
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    depends_on:
      - ollama
      - auditor-stt
    restart: unless-stopped

  # Person detection for piperception (job type perception-detect). Its own fffleet worker (own ID and port),
  # so the LCYT worker image does not need to change. CPU only on purpose: the GPU is shared with
  # speech-to-text and Ollama, and YOLOX-tiny on this CPU is about 30-40 ms per frame. Memory is capped
  # because the PC has 8 GB.
  detect-worker:
    image: ghcr.io/jsilvanus/piperception-detect-worker:${PIPERCEPTION_DETECT_VERSION:-latest}
    ports:
      - "${FFFLEET_DETECT_WORKER_PORT:-5101}:5100"
    environment:
      PORT: "5100"
      FFFLEET_WORKER_ID: ${FFFLEET_DETECT_WORKER_ID:-operator-pc-detect}
      FFFLEET_ADVERTISE_URL: ${FFFLEET_DETECT_ADVERTISE_URL:?set FFFLEET_DETECT_ADVERTISE_URL, e.g. http://10.0.0.50:5101}
      FFFLEET_ORCHESTRATOR_URL: ${FFFLEET_ORCHESTRATOR_URL:-http://10.0.0.78:5000}
      FFFLEET_WORKER_TOKEN: ${FFFLEET_WORKER_TOKEN:?set FFFLEET_WORKER_TOKEN}
      # One stream slot per camera (two now, room for cam3 and one spare).
      FFFLEET_SLOTS: ${FFFLEET_DETECT_SLOTS:-stream=4}
      FFFLEET_CAPABILITIES: ${FFFLEET_DETECT_CAPABILITIES:-host:operator-pc}
      # The worker advertises net:mediamtx only while it can reach MediaMTX on the Pi; piperception sets
      # PERCEPTION_REMOTE_REQUIRES=net:mediamtx, so jobs never land here when the stream is out of reach.
      FFFLEET_PROBE: mediamtx=${MEDIAMTX_RTSP_HOSTPORT:?set MEDIAMTX_RTSP_HOSTPORT, the Pi's MediaMTX RTSP host:port}
      PERCEPTION_ORT_PROVIDERS: cpu
      PERCEPTION_ORT_THREADS: ${PERCEPTION_ORT_THREADS:-4}
    mem_limit: ${DETECT_WORKER_MEM_LIMIT:-1g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  # Caption translation for PiVoice (job type translate, plan pivoice docs/translations/plan.md section 7).
  # Its own fffleet worker; CPU only like detect-worker (the GPU belongs to speech-to-text and Ollama).
  # No weights in the image: models live in the translate-models volume, read-only here. At start it loads
  # every model in models.json once and advertises translate:<src>-<tgt> for those that work, so a new model
  # needs `docker compose restart translate-worker`. Memory capped because the PC has 8 GB.
  translate-worker:
    image: ghcr.io/jsilvanus/pivoice-translate-worker:${PIVOICE_TRANSLATE_VERSION:-latest}
    ports:
      - "${FFFLEET_TRANSLATE_WORKER_PORT:-5102}:5100"
    environment:
      PORT: "5100"
      FFFLEET_WORKER_ID: ${FFFLEET_TRANSLATE_WORKER_ID:-operator-pc-translate}
      FFFLEET_ADVERTISE_URL: ${FFFLEET_TRANSLATE_ADVERTISE_URL:?set FFFLEET_TRANSLATE_ADVERTISE_URL, e.g. http://10.0.0.50:5102}
      FFFLEET_ORCHESTRATOR_URL: ${FFFLEET_ORCHESTRATOR_URL:-http://10.0.0.78:5000}
      FFFLEET_WORKER_TOKEN: ${FFFLEET_WORKER_TOKEN:?set FFFLEET_WORKER_TOKEN}
      # Small inline jobs (one batch of caption segments each); inference is serialised per model anyway.
      FFFLEET_KINDS: batch
      FFFLEET_SLOTS: ${FFFLEET_TRANSLATE_SLOTS:-default=2}
      # The entrypoint adds translate:<src>-<tgt> for every model that passed its start-up check.
      FFFLEET_CAPABILITIES: ${FFFLEET_TRANSLATE_CAPABILITIES:-host:operator-pc}
      TRANSLATE_THREADS: ${TRANSLATE_THREADS:-2}
      # At most two models in memory: about 870 MB RSS with two, and the PC has only a few hundred MB free (measured 2026-11-23).
      TRANSLATE_MAX_LOADED: ${TRANSLATE_MAX_LOADED:-2}
    volumes:
      - translate-models:/models:ro
    mem_limit: ${TRANSLATE_WORKER_MEM_LIMIT:-2g}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  # One-off: fetch or update translation models into the translate-models volume (not a service).
  #   docker compose --profile tools run --rm translate-models                       # fi-en (first rollout)
  #   docker compose --profile tools run --rm translate-models --directions fi-en,fi-sv
  # Directions without a published ONNX conversion need Python export (see pivoice fleet/translate/README.md).
  translate-models:
    image: ghcr.io/jsilvanus/pivoice-translate-worker:${PIVOICE_TRANSLATE_VERSION:-latest}
    profiles: ["tools"]
    entrypoint: ["node", "/app/fleet/translate/scripts/fetch-models.mjs", "--dir", "/models"]
    command: []
    user: root
    volumes:
      - translate-models:/models
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # Keep a model loaded this long after its last request (Ollama's own default is 5 minutes).
      # Callers (piagent, pidirector, picomposer, piembed) also send keep_alive per request.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-15m}
    # Ollama has no auth: reachable from this PC only. Other containers use http://ollama:11434.
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    restart: unless-stopped

  # S3 gateway for pistorage. The posix backend keeps every object as a plain file under /data (named volume
  # versitygw-data), so it is easy to back up and to move to Hetzner Object Storage later (only the pistorage
  # endpoint, bucket and keys change). The port is published on the LAN because the Pi connects from outside;
  # the keys are required, there is no anonymous access.
  versitygw:
    image: versity/versitygw:${VERSITYGW_VERSION:-latest}
    command: ["--access", "${VERSITYGW_ACCESS_KEY:?set VERSITYGW_ACCESS_KEY}", "--secret", "${VERSITYGW_SECRET_KEY:?set VERSITYGW_SECRET_KEY}", "--port", ":7070", "posix", "/data"]
    ports:
      - "${VERSITYGW_HOST_PORT:-7070}:7070"
    volumes:
      - versitygw-data:/data
    restart: unless-stopped

  # Creates the pistorage bucket (retries until the gateway answers) and exits.
  versitygw-init:
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      - versitygw
    environment:
      AWS_ACCESS_KEY_ID: ${VERSITYGW_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${VERSITYGW_SECRET_KEY}
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      BUCKET: ${PISTORAGE_BUCKET:-pistorage}
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 30); do
          if aws --endpoint-url http://versitygw:7070 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null; then echo "bucket $$BUCKET exists"; exit 0; fi
          if aws --endpoint-url http://versitygw:7070 s3api create-bucket --bucket "$$BUCKET" 2>/dev/null; then echo "bucket $$BUCKET created"; exit 0; fi
          sleep 2
        done
        echo "could not create bucket $$BUCKET" >&2; exit 1

volumes:
  translate-models:
  versitygw-data:
  auditor-stt-models:
  auditor-stt-data:
  ollama-data:
