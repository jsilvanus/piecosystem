# Placement for the church stack. Worker IDs are set with FFFLEET_WORKER_ID on each worker;
# capabilities with FFFLEET_CAPABILITIES (see docs/fleet-worker-roles.md for the full plan).
#
#   pi            usb, normal, host:pi, arch:arm64                      Pi 4: local USB capture hardware (slots: stream=2, default=1)
#   operator-pc   normal, dsk, gpu, nvenc, desktop, host:operator-pc    Operator PC: strong machine + GPU (slots: stream=8, default=4)
#   assisting-pc  normal, gpu, nvenc, host:assisting-pc                 Assisting CC: gaming laptop + GPU (slots: stream=4, default=2)
#   operator-pc-detect  host:operator-pc, type:perception-detect        piperception detection worker on the operator PC (stream=4)
#
# No pools: the workers start themselves and register.
placement:
  # piperception person detection (job type perception-detect): the detection workers. Only workers with the
  # piperception detect worker image have the type, so `others` just lets a future one join without an edit.
  - match: { type: perception-detect }
    workers: [operator-pc-detect, assisting-pc-detect]
    others: true
  # Hardware that only exists on the Pi (Hama USB capture, USB audio, ...). Jobs say requires: ["usb"].
  # No other worker has the capability, so this rule is a safety net as much as a preference.
  - match: { requires: ["usb"] }
    workers: [pi]
  # DSK / graphics rendering and anything that needs a GPU: operator PC first, assisting PC second. Never the Pi.
  - match: { type: dsk }
    workers: [operator-pc, assisting-pc]
  - match: { requires: ["gpu"] }
    workers: [operator-pc, assisting-pc]
  # Relay / MediaMTX work ("normal"): stream jobs say requires: ["normal"].
  # Assisting PC takes spare stream load first (e.g. piprogram feeders), operator PC second, Pi last.
  - match: { kind: stream, requires: ["normal"] }
    workers: [assisting-pc, operator-pc, pi]
  # Other stream jobs: same order.
  - match: { kind: stream }
    workers: [assisting-pc, operator-pc, pi]
  # Everything else: same order, and any other worker is allowed after them (least loaded).
  - workers: [assisting-pc, operator-pc, pi]
    others: true