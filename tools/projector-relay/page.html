<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Projektorit</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1b16;--card:#fff;--ac:#1f5f8b;--ok:#2e7d32;--bad:#b3261e;--line:#d8d2c4}
@media(prefers-color-scheme:dark){:root{--bg:#16150f;--fg:#f1ede2;--card:#24221a;--ac:#6bb3e0;--ok:#7bd88f;--bad:#ff8a80;--line:#3d3a2e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.35 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:22px;margin:0 0 12px}h2{font-size:18px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
button{font:inherit;min-height:56px;border-radius:12px;border:2px solid var(--ac);background:transparent;color:var(--fg);padding:8px 12px;width:100%}
button.on{background:var(--ac);color:#fff}button:active{opacity:.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:10px;margin-bottom:10px}
input{font:inherit;width:100%;min-height:56px;border-radius:12px;border:2px solid var(--line);padding:8px 12px;background:var(--card);color:var(--fg);margin-bottom:10px}
#msg{min-height:1.4em;margin:0 0 10px;font-weight:600}.err{color:var(--bad)}.good{color:var(--ok)}
.st{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.st:last-child{border:0}
small{opacity:.75}
</style></head><body>
<h1>Projektorit</h1>
<div id="login" class="card" hidden><h2>Anna PIN</h2>
<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button id="go" class="on">Kirjaudu</button></div>
<div id="app" hidden>
<p id="msg"></p>
<div class="card"><h2>Tila</h2><div id="status">Haetaan…</div></div>
<div class="card"><h2>1. Valitse projektori</h2><div class="grid" id="tg"></div></div>
<div class="card"><h2>2. Valitse kuva</h2><div class="grid" id="ins"></div></div>
<div class="card"><h2>Virta</h2>
<div class="row"><button data-p="proj1:on">Vasen päälle</button><button data-p="proj1:off">Vasen pois</button></div>
<div class="row"><button data-p="proj2:on">Oikea päälle</button><button data-p="proj2:off">Oikea pois</button></div>
<div class="row"><button data-p="both:on">Molemmat päälle</button><button data-p="both:off">Molemmat pois</button></div>
<small>Lämpeneminen kestää n. minuutin. Älä sammuta heti uudelleen.</small></div>
<small id="exp"></small>
</div>
<script>
const $=s=>document.querySelector(s),T=[["both","Molemmat"],["proj1","Vasen (1)"],["proj2","Oikea (2)"]],I=[[1,"Lukupulpetti"],[2,"Rack-PC"],[3,"Pi 1"],[4,"Pi 2"]];
const IN=Object.fromEntries(I);let target="both";
const say=(t,c)=>{$("#msg").textContent=t;$("#msg").className=c||""};
async function api(p,b){const r=await fetch(p,b?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}:{});
 if(r.status===401&&p!=="/api/login"){show(false);return null}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Virhe");return j}
function show(on){$("#login").hidden=on;$("#app").hidden=!on}
function draw(){$("#tg").innerHTML="";T.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;if(k===target)b.className="on";b.onclick=()=>{target=k;draw()};$("#tg").append(b)});
 $("#ins").innerHTML="";I.forEach(([n,l])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>act("/api/route",{input:n,target},"Kuva vaihdettu: "+l);$("#ins").append(b)})}
const PW={on:"päällä",standby:"pois (valmiustila)",warmup:"lämpenee",cooldown:"jäähtyy"};
async function refresh(){try{const s=await api("/api/status");if(!s)return;
 const p=x=>x?(PW[x.power]||x.power):"ei tietoa";const r=n=>s.routes&&s.routes[n]?IN[s.routes[n]]:"ei tietoa";
 $("#status").innerHTML=`<div class="st"><b>Vasen (1)</b><span>${p(s.proj1)} · ${r("proj1")}</span></div><div class="st"><b>Oikea (2)</b><span>${p(s.proj2)} · ${r("proj2")}</span></div>`;
 $("#exp").textContent="Sivu sulkeutuu "+new Date(s.expiresAt).toLocaleString("fi-FI")}catch(e){$("#status").textContent="Tilaa ei saatu: "+e.message}}
async function act(p,b,ok){say("Odota…");try{if(await api(p,b)){say(ok,"good");setTimeout(refresh,2500)}}catch(e){say(e.message,"err")}}
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const[t,w]=b.dataset.p.split(":");
 if(w==="off"&&!confirm("Sammutetaanko varmasti?"))return;act("/api/power",{target:t,power:w},w==="on"?"Käynnistetään…":"Sammutetaan…")});
$("#go").onclick=async()=>{try{await api("/api/login",{pin:$("#pin").value});$("#pin").value="";show(true);say("");refresh()}catch(e){alert(e.message)}};
$("#pin").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};
draw();api("/api/status").then(s=>{if(s){show(true);refresh()}else show(false)}).catch(()=>show(false));setInterval(()=>{if(!$("#app").hidden)refresh()},15000);
</script></body></html>
