# Paths that pi-backup.sh puts in the bundle. Globs; "~" is the target user's home.
# A directory is taken whole. Keep this file free of values, addresses and host names:
# it is public. Site-specific additions go in ~/.config/pi-backup/manifest.local.conf on the Pi.

[user]
~/apps/*.env
~/apps/*/*.env
~/apps/*/.env
~/apps/fffleet-orchestrator/fffleet.yaml
~/.config/systemd/user/*.service
~/.config/systemd/user/*.timer
~/.config/systemd/user/*.path
~/.config/pi-backup/manifest.local.conf
~/.config/pi-backup/recipients.txt
~/.ssh/authorized_keys
~/.ssh/config
~/.ssh/known_hosts

[system]
/etc/ssh/ssh_host_*
/etc/ssh/sshd_config
/etc/ssh/sshd_config.d
/home/*/.ssh/authorized_keys
/etc/nginx/nginx.conf
/etc/nginx/sites-available
/etc/nginx/sites-enabled
/etc/nginx/conf.d
/etc/letsencrypt
/etc/mediamtx
/usr/local/etc/mediamtx.yml
/etc/NetworkManager/system-connections
/etc/network/interfaces
/etc/network/interfaces.d
/etc/dhcpcd.conf
/etc/hostname
/etc/hosts
/etc/fstab
/etc/sudoers.d
/etc/udev/rules.d
/etc/asound.conf
/etc/systemd/system/*.service
/etc/systemd/system/*.timer
/boot/firmware/config.txt
/boot/firmware/cmdline.txt
